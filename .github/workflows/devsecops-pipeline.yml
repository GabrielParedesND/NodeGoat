# =====================================================================
#  DevSecOps Pipeline - SAST (Semgrep) + SBOM (CycloneDX/Syft)
#  + SCA (OWASP Dependency-Check) + Quality Gate (HIGH/CRITICAL)
#  Universidad Mariano Galvez - Seguridad en Aplicaciones - Tarea S07
# =====================================================================
name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Politica del Quality Gate
  SCA_FAIL_CVSS: "7"            # CVSS >= 7.0 (High/Critical) -> FAIL
  SAST_FAIL_SEVERITY: "ERROR"   # Semgrep ERROR (High) -> FAIL

jobs:
  # -------------------------------------------------------------------
  # FASE 2 - SAST con Semgrep
  # -------------------------------------------------------------------
  sast-semgrep:
    name: "SAST - Semgrep Code Scanning"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pipx install semgrep && semgrep --version

      - name: Ejecutar Semgrep (p/security-audit + p/owasp-top-ten)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --metrics=off \
            --sarif-output=semgrep-results.sarif \
            --json-output=semgrep-results.json

      - name: Subir artefacto SARIF/JSON de Semgrep
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif-report
          path: |
            semgrep-results.sarif
            semgrep-results.json

      - name: Publicar SARIF en GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # ---- QUALITY GATE (SAST): hallazgos ERROR/HIGH -> build FAIL ----
      - name: "Quality Gate SAST - fallar si hay hallazgos ERROR/HIGH"
        if: always()
        run: python3 .github/scripts/semgrep_gate.py semgrep-results.json

  # -------------------------------------------------------------------
  # FASE 3 - SBOM (CycloneDX) + SCA (OWASP Dependency-Check)
  # -------------------------------------------------------------------
  sca-and-sbom:
    name: "SCA & Generación de SBOM"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Generacion del SBOM en estandar CycloneDX
      - name: Generar SBOM con Syft (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: "sbom.cyclonedx.json"
          upload-artifact: false

      - name: Subir artefacto SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      # 2. Analisis SCA con OWASP Dependency-Check
      #    --failOnCVSS 7 = QUALITY GATE (SCA): CVSS >= 7.0 -> build FAIL
      #    Las excepciones documentadas viven en dependency-check-suppressions.xml
      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'AppSegura-NodeGoat'
          path: '.'
          format: 'ALL'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableExperimental
            --nodeAuditSkipDevDependencies
            --nodePackageSkipDevDependencies
            --suppression dependency-check-suppressions.xml

      - name: Resumen de hallazgos SCA (CVSS >= 7)
        if: always()
        run: python3 .github/scripts/dc_summary.py reports/dependency-check-report.json

      - name: Subir Reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  # -------------------------------------------------------------------
  # FASE 4 - Quality Gate consolidado
  # -------------------------------------------------------------------
  quality-gate:
    name: "Quality Gate (HIGH/CRITICAL)"
    runs-on: ubuntu-latest
    needs: [ sast-semgrep, sca-and-sbom ]
    if: always()
    steps:
      - name: Evaluar política de seguridad
        env:
          SAST_RESULT: ${{ needs.sast-semgrep.result }}
          SCA_RESULT: ${{ needs.sca-and-sbom.result }}
        run: |
          {
            echo "## Quality Gate - Política HIGH/CRITICAL"
            echo ""
            echo "| Control | Regla | Resultado |"
            echo "|---|---|---|"
            echo "| SAST (Semgrep) | Severidad ${SAST_FAIL_SEVERITY} => FAIL | ${SAST_RESULT} |"
            echo "| SCA (Dependency-Check) | CVSS >= ${SCA_FAIL_CVSS}.0 => FAIL | ${SCA_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SAST=${SAST_RESULT}  SCA=${SCA_RESULT}"
          if [ "$SAST_RESULT" != "success" ] || [ "$SCA_RESULT" != "success" ]; then
            echo "::error title=Quality Gate::BUILD FAILED - se detectaron hallazgos HIGH/CRITICAL"
            echo "**Resultado: BUILD FAILED**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**Resultado: BUILD PASSED**" >> "$GITHUB_STEP_SUMMARY"
          echo "Quality Gate superado: sin hallazgos HIGH/CRITICAL abiertos."
